name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt fastapi httpx

      - name: Run unit, parser, inference, and web tests
        run: |
          pytest tests/test_clean.py tests/test_forecast.py tests/test_models.py tests/test_parsers.py tests/test_ridge.py tests/test_inference.py tests/test_app.py tests/test_api.py tests/test_web.py -q
